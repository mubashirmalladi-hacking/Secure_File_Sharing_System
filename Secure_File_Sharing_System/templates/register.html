
{% extends "base.html" %}
{% block title %}Register | SecureShare{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Create Account</h2>
    <p class="text-secondary">Join SecureShare to store files safely.</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-label">Username</label>
        <input class="form-control mb-3" type="text" name="username" required minlength="3" maxlength="80" autocomplete="username">
        <label class="form-label">Password</label>
        <input class="form-control mb-4" type="password" name="password" required minlength="10" autocomplete="new-password">
        <button class="btn btn-primary w-100">Register</button>
    </form>
    <p class="mt-3 text-center">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
