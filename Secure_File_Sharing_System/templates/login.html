
{% extends "base.html" %}
{% block title %}Login | SecureShare{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Welcome Back 🔐</h2>
    <p class="text-secondary">Sign in to access your secure files.</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-label">Username</label>
        <input class="form-control mb-3" type="text" name="username" required maxlength="80" autocomplete="username">
        <label class="form-label">Password</label>
        <input class="form-control mb-4" type="password" name="password" required autocomplete="current-password">
        <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 text-center">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
